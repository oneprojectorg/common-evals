# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Common Application proposal evaluation starter

prompts:
  - |
    You are evaluating a proposal related to the Common Application.
    Task: {{task}}

    Return a concise, evidence-based result. Do not invent details that are not
    present in the input. For classification tasks, start with
    CLASSIFICATION: <one exact label>, then give a brief rationale. For merge
    tasks, start with MERGE DECISION: <yes, no, or insufficient information>,
    then give a brief rationale. Merge only proposals that request materially
    the same core change; related but distinct proposals should not be merged.
    If the descriptions do not provide enough detail to compare the requested
    changes, choose insufficient information. Choose no only when both changes
    are clear and materially distinct.

    Input:
    {{input}}

providers:
  - id: openai:gpt-4o-mini
    label: OpenAI GPT-4o mini
  - id: openai:chat:local-model
    label: llama-server local-model
    config:
      apiBaseUrl: http://127.0.0.1:8080/v1
      apiKeyRequired: false
      useDefaultApiKey: false
  - id: togetherai:meta-llama/Llama-3.3-70B-Instruct-Turbo
    label: Together AI Llama 3.3 70B

defaultTest:
  assert:
    - type: llm-rubric
      value: The response is relevant to the requested task, grounded in the provided input, and does not invent unsupported facts.

tests:
  - vars:
      task: Summarize the proposal in 2-3 sentences, including its goal and intended users.
      input: >-
        Add an optional applicant checklist to the Common Application dashboard.
        Applicants could mark required materials as complete and see which items
        are still outstanding. The checklist would be visible only to the applicant
        and would not affect how colleges review applications.
    assert:
      - type: llm-rubric
        value: Summarizes the checklist feature and its purpose without claiming it changes college review.

  - vars:
      task: >-
        Classify the proposal as one of: accessibility, applicant experience,
        integrations, or other. Give one short reason.
      input: >-
        Add an optional applicant checklist to the Common Application dashboard
        so applicants can track outstanding materials.
    assert:
      - type: contains
        value: "CLASSIFICATION: applicant experience"
      - type: llm-rubric
        value: Classifies the proposal as applicant experience and gives a reason consistent with the input.

  - vars:
      task: >-
        Decide whether this proposal should be merged with the related proposal.
        Give a yes-or-no decision and explain the key overlap or difference.
      input: >-
        Proposal: Add an optional applicant checklist to the Common Application
        dashboard so applicants can track outstanding materials.

        Related proposal: Send applicants email reminders when required materials
        are missing.
    assert:
      - type: contains
        value: "MERGE DECISION: no"
      - type: llm-rubric
        value: Recommends not merging because a checklist and email reminders are related but distinct changes, and explains that distinction.

  - vars:
      task: >-
        Classify the proposal as one of: accessibility, applicant experience,
        integrations, or other. Give one short reason.
      input: >-
        Improve screen-reader support in the application form by adding accessible
        labels and keyboard navigation for all required fields.
    assert:
      - type: contains
        value: "CLASSIFICATION: accessibility"
      - type: llm-rubric
        value: Classifies this as accessibility and cites a detail from the proposal.

  - vars:
      task: >-
        Decide whether this proposal should be merged with the related proposal.
        If the information is not enough to decide, say so and state what is missing.
      input: >-
        Proposal: Add a new dashboard feature for applicants.

        Related proposal: Improve the applicant experience.
    assert:
      - type: contains
        value: "MERGE DECISION: insufficient information"
      - type: llm-rubric
        value: Says the descriptions are too vague to determine whether the proposals should be merged, and identifies missing details without inventing them.

  - vars:
      task: >-
        Classify the proposal as one of: accessibility, applicant experience,
        integrations, or other. Give one short reason.
      input: >-
        Connect the application to the State University student information system
        so applicants can import verified enrollment and course records.
    assert:
      - type: contains
        value: "CLASSIFICATION: integrations"
      - type: llm-rubric
        value: Classifies this as integrations and cites the connection to an external student information system.

  - vars:
      task: >-
        Classify the proposal as one of: accessibility, applicant experience,
        integrations, or other. Give one short reason.
      input: >-
        Publish a quarterly public report showing aggregate application volume
        by year, with no applicant-level information.
    assert:
      - type: contains
        value: "CLASSIFICATION: other"
      - type: llm-rubric
        value: Classifies this as other and gives a reason consistent with the input.

  - vars:
      task: >-
        Decide whether this proposal should be merged with the related proposal.
        Return yes only if both proposals request materially the same core change.
        Explain the overlap.
      input: >-
        Proposal: Let applicants save a draft of their application and return later.

        Related proposal: Allow applicants to save application progress as a draft
        and resume it in a later session.
    assert:
      - type: contains
        value: "MERGE DECISION: yes"
      - type: llm-rubric
        value: Recommends merging because both proposals request saving a draft and resuming later.
