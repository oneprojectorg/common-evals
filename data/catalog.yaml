# Catalog of participatory budgeting (PB) and civic-input datasets.
#
# Each entry describes one source and the files `scripts/download.py` fetches
# into data/raw/<id>/. The entries follow the dataset review of 2026-10-08
# ("PB and civic-input datasets: one-table summary") and were re-verified
# against the live sources on 2026-10-20.
#
# Fields
#   id             folder name under data/raw/ and the argument to `just download`
#   access         public      files download without a login
#                  blocked     the server returns 403 to scripts; download in a browser
#                  internal    lives on our own platform; no public files
#                  request     ask the publisher or authors
#                  unreleased  announced but not yet published
#   resident_text  the free text residents wrote, if any
#   compressed     the shorter form the text was reduced to, and by whom
#   chain          the stages a submission can be traced through
#   names_present  true when author names are in the files; strip before use
#   license        the stated terms; "none stated" means we found none
#   eval_uses      the Common tasks the data can ground (summarization,
#                  classification, merge, screening)
#   files          name = local file name, url = download URL,
#                  unzip = extract the archive into the dataset folder
#
# Download with GET, not HEAD. Decidim exports redirect to presigned object
# storage URLs that reject HEAD requests.

datasets:

  - id: engaged-ca-la-fires
    name: Engaged California, LA Fires recovery consultation
    publisher: California Office of Data and Innovation
    homepage: https://engaged.ca.gov/
    description: >-
      State-run public consultation on wildfire recovery. Each comment carries
      the topic and conversation group assigned by the state's AI clustering.
    resident_text: COMMENT column, verbatim resident comments
    compressed: TOPIC and CONVERSATION_GROUP labels from AI clustering; summaries and the action plan are published on the site, not as files
    chain: comments -> AI clusters -> summaries -> action plan
    counts: 1,289 comments
    names_present: false
    license: none stated; ODI confirmation pending
    access: public
    eval_uses: [classification]
    files:
      - name: wildfire_agenda_setting_comments.csv
        url: https://engaged.ca.gov/public/data/wildfire_agenda_setting_comments.csv
        format: csv
        columns: [COMMENT_ID, TOPIC, CONVERSATION_GROUP, COMMENT]

  - id: engaged-ca-state-employees
    name: Engaged California, state employee efficiency consultation
    publisher: California Office of Data and Innovation
    homepage: https://engaged.ca.gov/
    description: >-
      Internal state-workforce consultation. Each extracted idea links to the
      comment it came from and carries assigned themes and subthemes.
    resident_text: COMMENT column in both files, verbatim employee comments
    compressed: IDEA_TEXT extracted from each comment, plus IDEA_MAIN_THEMES_LIST and IDEA_SUBTHEMES_LIST
    chain: comments -> extracted ideas -> themes -> summaries
    counts: 2,477 comments; 2,627 ideas
    names_present: false
    license: none stated; ODI confirmation pending
    access: public
    eval_uses: [summarization, classification]
    files:
      - name: State_employees_all_data.zip
        url: https://engaged.ca.gov/public/data/State_employees_all_data.zip
        format: zip
        unzip: true
        contents: [README.md, State_employees_all_comments.csv, State_employees_all_ideas.csv]

  - id: cambridge-pb
    name: Cambridge MA participatory budgeting, ideas and ballots
    publisher: City of Cambridge Open Data
    homepage: https://data.cambridgema.gov/Budget-Finance/Participatory-Budgeting-Ideas-Submitted-by-Communi/54vd-wdqj
    description: >-
      Thirteen PB cycles of resident ideas with the city's eligibility
      decision and reason, and the ballot projects with vote totals and
      winners.
    resident_text: Project Title and Project Description in the ideas file
    compressed: Project Status, the staff eligibility decision with its reason; Short Project Description on the ballot, written by staff
    chain: ideas -> staff screening -> ballot -> winners (full link in 2 of 13 cycles)
    counts: 12,674 ideas; 239 ballot projects; 2014-2026
    names_present: true
    names_columns: [Idea Submitter]
    license: ODC-PDDL
    access: public
    eval_uses: [classification, summarization, screening]
    files:
      - name: ideas.csv
        url: "https://data.cambridgema.gov/api/views/54vd-wdqj/rows.csv?accessType=DOWNLOAD"
        format: csv
        columns: [PB Cycle, Date Range, "Idea #", Committee, Project Title, Project Description, Project Status, Idea Submitter, Location, Latitude, Longitude, Winning Project ID, Idea Status, Link to Other Information, Desired Impact]
        note: the CSV export uses display names; the Socrata API uses snake_case field names
      - name: ballot_projects.csv
        url: "https://data.cambridgema.gov/api/views/uhwd-9y6q/rows.csv?accessType=DOWNLOAD"
        format: csv
        columns: [PB Cycle, Date Range, Project, Total Votes, Winning project, Project Cost, Capital Budget, Location Description, Short Project Description, Long Project Description, Winning Project ID, Project ID Aliases, Project Locations]

  - id: barcelona-decidim
    name: Barcelona Decidim open data export
    publisher: Ajuntament de Barcelona
    homepage: https://www.decidim.barcelona/open-data
    description: >-
      Proposals, bilingual city answers, stance-labeled comments, and ballot
      projects linked to source proposals, across the 2020 and 2024 PB cycles.
    resident_text: proposal titles and bodies, comments
    compressed: city answers to proposals; ballot project descriptions
    chain: proposals -> city answer -> ballot -> votes
    counts: 5,589 proposals; 11,467 comments; 423 ballot projects
    names_present: true
    license: CC BY-SA for user content
    access: blocked
    access_note: >-
      The server answers scripted requests with an nginx 403. Open the
      homepage in a browser, click Download, and save the zip as
      data/raw/barcelona-decidim/decidim-barcelona-open-data.zip, then unzip it there.
    eval_uses: [summarization, classification, merge, screening]
    files:
      - name: decidim-barcelona-open-data.zip
        url: https://www.decidim.barcelona/open-data/download
        format: zip
        unzip: true

  - id: toulouse-decidim
    name: Toulouse Je Participe open data export
    publisher: Toulouse Métropole
    homepage: https://jeparticipe.metropole.toulouse.fr/open-data
    description: >-
      Full pre-shortlist PB proposal pool with a written city answer for every
      rejection. Proposal IDs join to the Toulouse instances in Pabulib.
    resident_text: title/fr and body/fr in the proposals file
    compressed: answer/fr, the city's written answer; state, the screening outcome
    chain: proposals -> city answer -> ballot -> votes
    counts: 3,214 PB proposals; 2021, 2023
    names_present: true
    license: Licence Ouverte 2.0
    access: public
    eval_uses: [summarization, screening, merge]
    files:
