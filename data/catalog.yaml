  - id: pabulib
    name: Pabulib participatory budgeting library
    publisher: Pabulib (University of Warsaw and contributors)
    homepage: https://pabulib.org
    description: >-
      Standard social-choice library of real PB ballots and project metadata.
      Files are served one instance at a time as .pb text files; the bulk
      download runs behind a Cloudflare check in the browser.
    resident_text: none; project titles only
    compressed: none
    chain: ballots -> winners
    counts: about 2,050 instances across 29 cities; Toulouse has 23
    names_present: false
    license: not stated
    access: public
    access_note: >-
      One sample instance is listed below. For more, read the city list at
      https://pabulib.org/api/options and fetch https://pabulib.org/download/<Country>_<City>_<Year>[_<Unit>].pb
      per instance, or use the site's bulk download in a browser.
    eval_uses: []
    files:
      - name: France_Toulouse_2019.pb
        url: https://pabulib.org/download/France_Toulouse_2019.pb
        format: pb

