          - jeparticipe.metropole.toulouse.fr-open-data-projects.csv
          - jeparticipe.metropole.toulouse.fr-open-data-meetings.csv
          - jeparticipe.metropole.toulouse.fr-open-data-meeting_comments.csv
          - jeparticipe.metropole.toulouse.fr-open-data-results.csv
          - jeparticipe.metropole.toulouse.fr-open-data-result_comments.csv
        note: semicolon-delimited; proposals columns include id, category/name/fr, title/fr, body/fr, state, answer/fr, supports

